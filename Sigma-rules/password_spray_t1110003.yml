title: Passwordd Spray Attack - Multiple Failed Logons:
id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
status: experimental
description: Detects multiple failed logon attempts against different accounts from the same source - indicative of password spraying activity
author: Kent Yam
date: 2026/08/04
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4625
    condition: selection | count(TargetUserName) by IpAddress > 3
falsepositives:
    - Legitimate administrative scripts
    - Misconfigured applications with wrong credentials
level: medium
tags:
    - attack.credential_access
    - attack.t1110.003
